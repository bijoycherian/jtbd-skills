<meta charset="utf-8">
<title>__PAGE_TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: working tool on warm neutrals. Header with actions; estimate banner; landscape card (legend + chart) beside the score table; stacks below 1040px. One accent (blue) for selection and actions; zone colours only for zones. */
:root{
  /*__TOKENS_LIGHT__*/
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  /*__TOKENS_DARK__*/ color-scheme:dark}}
:root[data-theme="dark"]{
  /*__TOKENS_DARK__*/ color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:24px 40px;display:flex;flex-direction:column;gap:16px}
@media (min-width:720px){.wrap{padding-inline:32px}}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:13.5px}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-start;justify-content:space-between}
.actions{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font:inherit;font-weight:500;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn svg{width:14px;height:14px}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:240px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:6px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu button,.menu label{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu label:hover{background:var(--bg)}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.menu small{display:block;color:var(--muted);font-size:12px}
button:focus-visible,input:focus-visible,label:focus-within,.pt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:10px;padding:10px 14px}
.banner b{font-weight:600}
.banner .est{flex:0 0 auto;margin-top:2px;width:16px;height:16px;border-radius:50%;border:2px solid currentColor}
.main{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:1040px){.main{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr)}.chartcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.chartcard{padding:16px 16px 14px}
.legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:6px}
.lg{border:1px solid transparent;background:none;color:var(--ink);font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:3px 8px 3px 6px;border-radius:6px;cursor:pointer}
.lg:hover{border-color:var(--line)}
.lg[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.lg .sw{width:11px;height:11px;border-radius:3px;border:1px solid var(--line-strong)}
.lgroup{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px 4px}
.glabel{border:1px solid transparent;background:none;font:inherit;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--z-under-ink);padding:3px 6px;border-radius:6px;cursor:pointer}
.glabel .n{font-family:var(--f-mono);color:var(--muted);font-weight:400;letter-spacing:0}
.glabel[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.lg .n{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
#chart svg{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none}
#chart .pt.selpt{touch-action:none;cursor:grab}
.reason{display:flex;gap:6px;align-items:center;flex-basis:100%;margin-top:2px}
.reason input{flex:1;min-width:0;font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--accent);border-radius:6px;background:var(--surface);color:var(--ink)}
.hist{margin:0;padding-left:16px}
.hist li{margin:3px 0}
.hist .when{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.tag.override{color:var(--warn-ink);border-color:var(--warn-line);background:var(--warn-bg)}
.keyline{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:12.5px;padding-top:6px}
.keyline span{display:inline-flex;gap:6px;align-items:center}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;padding-block:14px}
th:first-child,td:first-child{padding-left:20px}
th.num,td.num{text-align:right}
tr.row td{transition:background .12s}
tr.row.sel td{background:var(--accent-tint)}
tr.row.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent);color:var(--accent);font-weight:600}
.lab{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.need{font-weight:500;font-size:14.5px}
.stmt{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:60ch}
.prov{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.tag{font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--est-bg);color:var(--est-ink);border:1px solid var(--line)}
.tag.survey{color:var(--ink);border-color:var(--line-strong)}
.link{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.tag.edited{color:var(--accent);border-color:var(--accent);background:transparent}
.tag.judge{color:var(--ink);border-color:var(--ink)}
.banner .based{display:block;font-weight:600;margin-bottom:2px}
.banner .skew{display:block;margin-top:4px}
.wording{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 14px}
.wording label{display:flex;flex-direction:column;gap:3px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.wording input{font:inherit;font-size:13.5px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;width:100%}
.wording input.changed{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.wording .orig{font-size:12px;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400}
.lint{grid-column:1/-1;font-size:12.5px;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:6px;padding:6px 10px}
.lint ul{margin:0;padding-left:16px}
.flag{color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-line);font-size:11.5px;padding:0 6px;border-radius:4px}
input[type=number]{width:60px;font:inherit;font-family:var(--f-mono);font-size:14.5px;font-variant-numeric:tabular-nums;text-align:center;padding:7px 4px;border:1px solid transparent;border-bottom:1.5px dashed var(--est-line);border-radius:6px 6px 0 0;background:var(--bg);color:var(--ink);-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{appearance:textfield}
input[type=number].firm{border-bottom:1.5px solid var(--ink);background:var(--surface)}
input[type=number]:hover{border-color:var(--line-strong)}
.score{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14.5px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap}
tr.det td{background:var(--bg);font-size:13px;padding-block:14px}
.detgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.detgrid h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500}
.detgrid p{margin:0}
.detgrid ul{margin:0;padding-left:16px}
.detgrid li{margin:3px 0}
.qid{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.localnote{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.localnote.dirty{color:var(--ink);background:var(--plot)}
.localnote button{font:inherit;font-weight:600;color:var(--ink);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
.tfoot{padding:14px 20px;color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.tfoot .eg{display:inline-block;width:26px;border-bottom:1.5px dashed var(--est-line);vertical-align:middle}
.tfoot .eg.firm{border-bottom-style:solid;border-color:var(--ink)}
.foot{color:var(--muted);font-size:12.5px;display:grid;gap:4px;max-width:90ch}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;max-width:calc(100vw - 32px);z-index:9}
.empty{padding:28px 20px;color:var(--muted)}
@media (max-width:640px){
  table{min-width:0}
  thead{display:none}
  tr.row{display:grid;grid-template-columns:30px 70px 70px 1fr auto;grid-template-areas:"n job job job job" "n imp sat score zone";column-gap:8px;padding:12px 14px 12px 0;border-bottom:1px solid var(--line)}
  tr.row td{border:0;padding:0}
  tr.row td:nth-child(1){grid-area:n;padding-left:14px;padding-top:2px}
  tr.row td:nth-child(2){grid-area:job;padding-bottom:10px}
  tr.row td:nth-child(3){grid-area:imp;text-align:left}
  tr.row td:nth-child(4){grid-area:sat;text-align:left}
  tr.row td:nth-child(5){grid-area:score;align-self:center;text-align:left}
  tr.row td:nth-child(6){grid-area:zone;align-self:center}
  tr.row td:nth-child(3)::before{content:"Imp.";display:block;font-size:11px;color:var(--muted)}
  tr.row td:nth-child(4)::before{content:"Sat.";display:block;font-size:11px;color:var(--muted)}
  tr.row td:nth-child(5)::before{content:"Score";display:block;font-size:11px;color:var(--muted);font-family:var(--f-body)}
  tr.row.sel td:first-child{box-shadow:none}
  tr.row.sel{background:var(--accent-tint);box-shadow:inset 3px 0 0 var(--accent)}
  tr.det{display:block}
  tr.det td{display:block;padding:14px}
  tr.det td:first-child{display:none}
  .stmt{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="head">
    <div>
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="actions">
      <button class="btn" id="export" type="button" aria-haspopup="true" aria-expanded="false">Export <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <label class="btn primary" for="survey">Add survey data<input id="survey" type="file" accept=".csv,text/csv" hidden></label>
      <div class="menu" id="menu" role="menu" hidden>
        <button type="button" role="menuitem" data-act="png">Chart image (PNG)</button>
        <button type="button" role="menuitem" data-act="xlsx">Spreadsheet (Excel)<small>Scores and zones as live formulas</small></button>
        <button type="button" role="menuitem" data-act="csv">Jobs file (CSV)<small>Everything, with quotes. Keep it for the next run</small></button>
        <div class="sep"></div>
        <button type="button" role="menuitem" data-act="copy">Copy changes for Claude</button>
        <button type="button" role="menuitem" data-act="report">Copy run report<small>Counts only, no customer content. For a GitHub issue</small></button>
        <label role="menuitem" for="import">Import edited CSV<input id="import" type="file" accept=".csv,text/csv" hidden></label>
        <div class="sep"></div>
        <button type="button" role="menuitem" data-act="reset" id="reset">Restore original scores and wording</button>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" role="status" hidden><span class="est" aria-hidden="true"></span><div id="bannertext"></div></div>

  <div class="main">
    <section class="card chartcard" aria-label="Opportunity map">
      <div class="legend" id="legend" role="group" aria-label="Filter by zone"></div>
      <div id="chart"></div>
      <div class="keyline" id="keyline"></div>
    </section>
    <section class="card" aria-label="Opportunity scores">
      <div class="localnote" id="localnote" role="status"><span id="localtext">Edits you make here are saved in this browser only. Teammates won't see them.</span><button type="button" id="localexport">Export jobs file</button></div>
      <div class="tscroll">
        <table>
          <thead><tr>
            <th>#</th><th>Job</th>
            <th class="num" title="Importance: % rating 4–5">Imp.</th><th class="num" title="Satisfaction: % rating 4–5">Sat.</th>
            <th class="num"><button class="link" id="sort" type="button" title="Sort by score" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase">Score ↓</button></th>
            <th>Zone</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="tfoot"><span><span class="eg"></span> AI estimate</span><span><span class="eg firm"></span> your judgement or survey</span><span>Edit a value, ask Claude about it, or add survey data to measure it.</span></div>
    </section>
  </div>

  <footer class="foot" id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const DATA = /*__LANDSCAPE_DATA__*/null;
(function(){
"use strict";
const D = DATA || {title:"Opportunity map",study:"",jobs:[]};
const R = Object.assign({tableStakesSat:85, underSatMin:80, underImpMin:90, solidOpp:10, highOpp:12}, D.rules||{});
const ZONES = [
  {k:"High opportunity",  short:"High",         v:"--z-high",   ink:"--z-high-ink"},
  {k:"Solid opportunity", short:"Solid",        v:"--z-solid",  ink:"--z-solid-ink"},
  {k:"Modest opportunity", short:"Modest",      v:"--z-under",  ink:"--z-under-ink"},
  {k:"Table stakes",      short:"Table stakes", v:"--z-stakes", ink:"--z-stakes-ink"},
  {k:"Served right",      short:"Served right", v:"--plot",     ink:"--ink"},
  {k:"Over-served",       short:"Over-served",  v:"--z-over",   ink:"--z-over-ink"}
];
const STORE = "jtbd-landscape:" + (D.study || D.title);
/* where each score came from (references/jobs-file.md): ai, evidence_update, judgement, survey */
const NS = s => { s = String(s || "").trim().toLowerCase(); return ({"": "ai", edited: "judgement", "your judgement": "judgement", "evidence update": "evidence_update", "ai estimate": "ai"})[s] || s; };
const SRC = {ai: "AI estimate", evidence_update: "evidence update", judgement: "your judgement", survey: "survey"};
const isEst = j => j.source === "ai" || j.source === "evidence_update";
function basedOn(list, who){ const c = {}; list.forEach(j => c[j.source] = (c[j.source] || 0) + 1);
  return "Based on: " + ["ai", "judgement", "evidence_update", "survey"].filter(k => c[k]).map(k => c[k] + " " + (k === "judgement" && who === "team" ? "team judgement" : SRC[k]) + ((k === "ai" || k === "evidence_update") && c[k] !== 1 ? "s" : "")).join(" · "); }
function trustNote(list){ const judged = list.filter(j => j.source === "judgement").length;
  if (judged) return `${judged} score${judged === 1 ? " reflects" : "s reflect"} your team's view rather than customer evidence. Survey before deciding what to build.`;
  if (list.length && list.every(j => j.source === "survey")) return "All scores are measured. Check the margins of error and any “zone could change” flags.";
  return "Scores include AI estimates: good for choosing what to survey. Run the survey before deciding what to build."; }
const LOGS = (D.logs || []);
const splitL = v => String(v || "").split(/[;,\s]+/).filter(Boolean);
const DECISIONS = LOGS.filter(g => g.field === "decision");
const logsFor = j => LOGS.filter(g => g.field === "decision" ? splitL(g.label).includes(String(j.label)) : g.label === j.label);
function decisionLine(){
  const g = DECISIONS[DECISIONS.length - 1]; if (!g) return "";
  const then = {}; String(g.zone_from || "").split(" | ").forEach(p => { const i = p.indexOf(":"); if (i > 0) then[p.slice(0, i).trim()] = p.slice(i + 1).split(" · ")[0].trim(); });
  const moved = Object.keys(then).filter(L => { const j = byLabel(L); return j && zone(j.importance, j.satisfaction) !== then[L]; });
  return `<span class="based">Decided ${esc(String(g.logged_at).slice(0, 10))}: ${esc(g.to)} (jobs ${esc(splitL(g.label).join(", "))}${g.evidence_ids ? "; " + splitL(g.evidence_ids).length + " quotes" : ""}).</span> ` +
    moved.map(L => `Job ${esc(L)} has moved from ${esc(then[L])} to ${esc(zone(byLabel(L).importance, byLabel(L).satisfaction))} since. `).join("");
}
const WFIELDS = ["context", "barrier", "goal", "outcome"];
const WLABEL = {context:"When", barrier:"But", goal:"Help me", outcome:"So"};
const wordingEdited = j => WFIELDS.some(f => (j[f] || "") !== (j._orig[f] || ""));

/* the skill's automatic statement checks (SKILL.md step 4, checks 1-4), run as you type */
const SOLUTION = /\b(app|feature|button|chat|dashboard|portal|integration|notification|reminders?|automatic(ally)?|real[- ]time|documentation|api|plugin|widget|screen|tab)\b/i;
const COMPANY = /\b(because (we|the company|our product) (is|are)n?'?t|our platform|marketplace|PDP|SKU|e2e)\b/i;
function lintJob(j){
  const out = [];
  if (SOLUTION.test(j.goal || "")) out.push("The goal names a product or mechanism. Describe the need, not the solution.");
  if (/\b(and|&)\b.*\b(also|chat|communicat)|\band\b.*\band\b/i.test(j.goal || "")) out.push("The goal may hold two needs. Split them by asking Claude.");
  if (COMPANY.test([j.context, j.barrier, j.goal, j.outcome].join(" "))) out.push("This reads like company language. Use the customer's words.");
  const same = jobs.filter(o => o !== j && (o.outcome || "").trim().toLowerCase() === (j.outcome || "").trim().toLowerCase() && (j.outcome || "").trim());
  if (same.length) out.push(`The "so" part matches job ${same.map(o => o.label).join(", ")}. Make the outcome specific to this job.`);
  return out;
}

/*ZONE-START*/
const opp = (i,s) => i/10 + Math.max(i-s,0)/10;
function zone(i,s){
  const o = opp(i,s);
  if (s > i) return "Over-served";
  if (s > R.tableStakesSat) return "Table stakes";
  if (s >= R.underSatMin && i >= R.underImpMin) return "Modest opportunity";
  if (s < R.underSatMin && o > R.highOpp) return "High opportunity";
  if (s < R.underSatMin && o >= R.solidOpp) return "Solid opportunity";
  return "Served right";
}
/*ZONE-END*/
const clamp = v => Math.max(0, Math.min(100, Math.round(Number(v)||0)));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
const zinfo = z => ZONES.find(x => x.k === z);

const jobs = D.jobs.map(j => Object.assign({}, j, {
  label: String(j.label), importance: Number(j.importance), satisfaction: Number(j.satisfaction), source: NS(j.source),
  _i: Number(j.importance), _s: Number(j.satisfaction), _src: NS(j.source),
  _orig: Object.fromEntries(WFIELDS.map(f => [f, (j.original && j.original[f]) || j[f] || ""])),
  _t0: Object.fromEntries(WFIELDS.map(f => [f, j[f] || ""])),
  evidence: j.evidence || [], contradicts: j.contradicts || [],
  base: j.survey_importance !== undefined && j.survey_importance !== "" && j.survey_importance !== null
    ? {i: Number(j.survey_importance), s: Number(j.survey_satisfaction), src: "survey", n: j.n}
    : {i: Number(j.importance), s: Number(j.satisfaction), src: NS(j.source), n: j.n},
  history: [], unlocked: false
}));
const personas = [...new Set(jobs.map(j => j.persona || "Unassigned"))];
let st = {zones: new Set(), sel: null, open: new Set()};
try { const saved = JSON.parse(localStorage.getItem(STORE) || "null");
  if (saved && saved.edits) for (const j of jobs) { const e = saved.edits[j.label]; if (e) { if (e.i !== undefined) { j.importance = e.i; j.satisfaction = e.s; j.source = NS(e.src); if (e.n) j.n = e.n; } if (e.t) Object.assign(j, e.t); if (e.h) j.history = e.h; if (e.b) j.base = e.b; if (e.u) j.unlocked = true; } }

function pageLogRows(){

    const base = {schema_version: "1.0", record_type: "log", label: j.label, logged_at: at, source: src, by: h.kind === "survey" ? "page" : "user", reason: h.reason || "", version: D.version || ""};

      if (h.from[0] !== h.to[0]) out.push(Object.assign({}, base, {field: h.kind === "survey" ? "survey" : "importance", from: h.from[0], to: h.to[0], zone_from: zf, zone_to: zt}));
      if (h.from[1] !== h.to[1]) out.push(Object.assign({}, base, {field: h.kind === "survey" ? "survey" : "satisfaction", from: h.from[1], to: h.to[1], zone_from: zf, zone_to: zt}));
    } else if (h.kind === "wording" && h.field) {
      const z = zone(j.importance, j.satisfaction);

    const r = Object.assign({}, j, {

      opportunity: opp(j.importance,j.satisfaction).toFixed(2), zone: zone(j.importance,j.satisfaction), wording_edited: we ? "yes" : ""},

  ws["!autofilter"] = {ref:`A1:Q${rows.length}`};
  X.utils.book_append_sheet(wb, ws, "Opportunity scores");
  const ev = [["Label","Kind","Source ID","Excerpt"]];
  jobs.forEach(j => { j.evidence.forEach(e => ev.push([j.label,"Supports",e.id,e.text])); j.contradicts.forEach(e => ev.push([j.label,"Points the other way",e.id,e.text])); });
  const wse = X.utils.aoa_to_sheet(ev); wse["!cols"] = [{wch:6},{wch:20},{wch:10},{wch:90}];
  X.utils.book_append_sheet(wb, wse, "Evidence");
  const chg = [["When (UTC)","Job","Changed","From","To","Zone before","Zone after","Source","By","Reason"]];
  LOGS.concat(pageLogRows()).forEach(g => chg.push([g.logged_at, g.label, g.field, g.from, g.to, g.zone_from, g.zone_to, g.field === "decision" ? "decision" : (SRCX[NS(g.source)] || g.source), g.by, g.reason || ""]));
  if (chg.length === 1) chg.push(["", "", "No changes yet", "", "", "", "", "", "", ""]);
  const wsc = X.utils.aoa_to_sheet(chg); wsc["!cols"] = [{wch:20},{wch:6},{wch:12},{wch:10},{wch:10},{wch:18},{wch:18},{wch:16},{wch:8},{wch:60}];
  X.utils.book_append_sheet(wb, wsc, "Decision log");
  const sv = [["Label","Persona","Importance question (1–5)","Satisfaction question (1–5)","Note"]];
  jobs.forEach(j => sv.push([j.label, j.persona, `${cap(String(j.context||"").replace(/[,. ]+$/,""))}: ${cap(j.goal)}. How important is this to you?`, "How satisfied are you today with how well you can do this?",
    wordingEdited(j) ? (j.source === "survey" ? "Wording edited after the survey; existing ratings used the original wording" : "Wording edited on the page") : ""]));
  const wss = X.utils.aoa_to_sheet(sv); wss["!cols"] = [{wch:6},{wch:16},{wch:80},{wch:50},{wch:50}];
  X.utils.book_append_sheet(wb, wss, "Survey");
  const rl = [["Rule","Value","Meaning"],
    ["Table stakes: satisfaction above", R.tableStakesSat, "Over-served is checked first (satisfaction > importance)"],
    ["Modest opportunity: satisfaction from", R.underSatMin, "…up to the table-stakes value, with importance at least the next row"],
    ["Modest opportunity: importance at least", R.underImpMin, ""],
    ["Underserved", "", "The group of High, Solid and Modest opportunity"],
    ["Solid opportunity: score from", R.solidOpp, "With satisfaction below the Modest minimum"],
    ["High opportunity: score above", R.highOpp, "With satisfaction below the Modest minimum"],
    ["Opportunity score (0–20)", "", "importance/10 + max(importance − satisfaction, 0)/10"]];
  const wsr = X.utils.aoa_to_sheet(rl); wsr["!cols"] = [{wch:34},{wch:8},{wch:70}];
  X.utils.book_append_sheet(wb, wsr, "Rules");
  const out = X.write(wb, {bookType:"xlsx", type:"array"});
  save(base() + "-opportunity-scores.xlsx", new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
async function copyText(txt, okMsg){
  try { await navigator.clipboard.writeText(txt); toast(okMsg); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("aria-label","Text to copy"); ta.style.cssText = "position:fixed;inset:20% 16px auto;height:40%;z-index:9;font:13px var(--f-mono)"; document.body.appendChild(ta); ta.select(); toast("Select the text and copy it."); ta.addEventListener("blur", () => ta.remove()); ta.focus(); }
}

  const zc = {}; ZONES.forEach(z => zc[z.k] = 0); jobs.forEach(j => zc[zone(j.importance, j.satisfaction)]++);
  const src = {ai: 0, evidence_update: 0, judgement: 0, survey: 0}; jobs.forEach(j => src[j.source] = (src[j.source] || 0) + 1);
  const M = D.meta || {}, under = ["High opportunity","Solid opportunity","Modest opportunity"].reduce((a, k) => a + zc[k], 0);
  const rescored = jobs.filter(j => j.importance !== j._i || j.satisfaction !== j._s).length, reworded = jobs.filter(wordingEdited).length;
  const n = s => new Set(jobs.map(j => j[s]).filter(Boolean)).size;
  const txt = [
    "JTBD Opportunity Landscape run report (counts only, no customer content)",
    `- Skill version: ${D.version || "unknown"}`,

    `- Sources cited as evidence: ${D.sources_summary}`,
    `- Jobs: ${jobs.length} (${n("persona")} persona${n("persona") === 1 ? "" : "s"}, ${n("stage")} stages)`,
    `- Zones: Underserved ${under} (${ZONES.slice(0, 3).map(z => z.short + " " + zc[z.k]).join(", ")}) · ${ZONES.slice(3).map(z => z.short + " " + zc[z.k]).join(" · ")}`,
    `- Score sources: ${src.ai} AI estimates, ${src.evidence_update} evidence updates, ${src.judgement} your judgement, ${src.survey} survey; ${jobs.filter(overrides).length} judgement over survey`,
    `- Decision log: ${LOGS.length + pageLogRows().length} entries`,
    `- Corrections on the page: ${rescored} re-scored, ${reworded} reworded`,
    "",
    "Please fill in (all optional):",
    "- AI tool and model:",
    "- Study size (interviews, tickets; words if you know):",
    "- Changes at checkpoint 1 and 2 (e.g. 11 draft jobs to 9):",
    "- Minutes from inputs to map:",
    "- Of the skill's top 5 jobs, how many are in your own top 5:",
    "- Did the team decide? Was it based on an underserved job?",
    "- Was install the hardest part? Was handing edits back painful? Did the team decide together? Will you repeat the study?",
    "- What did you need to do next?",
    "- What was wrong or missing:",
    "",
    "Counts only. Don't add your research question, company name, job wording or quotes."
  ].join("\n");
  copyText(txt, "Copied. Paste it into a run-report issue.");
}
async function copyChanges(){
  const sc = jobs.filter(j => j.importance !== j._i || j.satisfaction !== j._s), wd = jobs.filter(wordingEdited);
  if (!sc.length && !wd.length) { toast("No changes yet. Edit a score or wording first."); return; }
  let lines = [];
  if (sc.length) lines = lines.concat([`Score changes for ${D.title || "the map"}:`], sc.map(j =>
    `- #${j.label} (${j.persona}) "${j._orig.goal}": importance ${j._i} → ${j.importance}, satisfaction ${j._s} → ${j.satisfaction}; zone ${zone(j._i,j._s)} → ${zone(j.importance,j.satisfaction)}${j.source === "survey" ? " (survey" + (j.n ? ", n = " + j.n : "") + ")" : ""}${overrides(j) ? " (overrides survey " + j.base.i + "/" + j.base.s + ")" : ""}` +
    (j.history.filter(h => h.kind === "scores" && h.reason).map(h => `\n    reason: ${h.reason}`).join(""))));
  if (wd.length) lines = lines.concat([(sc.length ? "\n" : "") + "Wording changes (please re-check that the evidence and scores still fit, and re-run the statement checks):"], wd.flatMap(j =>
    [`- #${j.label} (${j.persona})`].concat(WFIELDS.filter(f => (j[f] || "") !== (j._orig[f] || "")).map(f => `    ${f}: "${j._orig[f]}" → "${j[f]}"`),
      j.history.filter(h => h.kind === "wording" && h.reason).map(h => `    reason: ${h.reason}`))));
  const txt = lines.join("\n");
  try { await navigator.clipboard.writeText(txt); toast("Copied. Paste it into your chat with Claude."); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("aria-label","Changes to copy"); ta.style.cssText = "position:fixed;inset:20% 16px auto;height:40%;z-index:9;font:13px var(--f-mono)"; document.body.appendChild(ta); ta.select(); toast("Select the text and copy it."); ta.addEventListener("blur", () => ta.remove()); ta.focus(); }
}

/* CSV import: edited CSV (Import edited CSV) or survey results (Add survey data) */
function parseCSV(t){
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i+1] === "\n") i++; row.push(f); out.push(row); row = []; f = ""; }
    else f += c; }
  if (f || row.length) { row.push(f); out.push(row); }
  return out.filter(r => r.some(x => x.trim()));
}
function importCSV(file, asSurvey){
  const fr = new FileReader();
  fr.onload = () => {
    const rows = parseCSV(String(fr.result)); const h = (rows.shift() || []).map(x => x.trim().toLowerCase());
    const rt = h.indexOf("record_type"); if (rt >= 0) for (let k = rows.length - 1; k >= 0; k--) if ((rows[k][rt] || "job").trim() !== "job") rows.splice(k, 1);
    const col = n => h.indexOf(n), li = col("label") >= 0 ? col("label") : col("id"), ii = col("importance"), si = col("satisfaction"), sr = col("source"), ni = col("n");
    if (li < 0 || ii < 0 || si < 0) { toast("That file needs label, importance and satisfaction columns (% rating 4–5)."); return; }
    let n = 0;
    rows.forEach(r => { const j = byLabel((r[li]||"").trim()); if (!j || r[ii] === undefined || r[ii] === "") return;
      j.importance = clamp(r[ii]); j.satisfaction = clamp(r[si]);
      if (ni >= 0 && r[ni]) j.n = r[ni].trim();
      const s = sr >= 0 ? (r[sr]||"").trim().toLowerCase() : "";
      const from = [j.base.i, j.base.s];
      if (asSurvey || s.startsWith("survey")) { j.source = "survey"; j.base = {i: j.importance, s: j.satisfaction, src: "survey", n: j.n}; j.unlocked = false;
        j.history.push({t: Date.now(), kind: "survey", from, to: [j.importance, j.satisfaction], reason: "Survey results imported" + (j.n ? " (n = " + j.n + ")" : "")}); }
      else { j.source = (j.importance === j.base.i && j.satisfaction === j.base.s) ? j.base.src : (["evidence_update", "judgement"].includes(NS(s)) ? NS(s) : "judgement"); }
      if (!asSurvey) WFIELDS.forEach(f => { const c = col(f); if (c >= 0 && r[c] !== undefined && r[c].trim()) j[f] = r[c].trim(); });
      n++; });
    persist(); renderAll(); toast(`Updated ${n} job${n === 1 ? "" : "s"} from ${file.name}${asSurvey ? " as survey results" : ""}`);
  };
  fr.readAsText(file);
}

/* reset: two-step, no dialogs */
let armed = null;
function resetAll(btn){
  if (!armed) { btn.textContent = "Click again to restore all"; armed = setTimeout(() => { btn.textContent = "Restore original scores and wording"; armed = null; }, 3000); return; }
  clearTimeout(armed); armed = null; btn.textContent = "Restore original scores and wording"; closeMenu();
  jobs.forEach(j => { j.importance = j._i; j.satisfaction = j._s; j.source = j._src; WFIELDS.forEach(f => j[f] = j._t0[f]);
    j.history = []; j.unlocked = false; j.base = {i: j._i, s: j._s, src: j._src, n: j.n}; });
  try { localStorage.removeItem(STORE); } catch(e) {}
  renderAll(); toast("All scores restored");
}
